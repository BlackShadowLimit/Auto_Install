### --- 語言與地區 ---
d-i debian-installer/language string en
d-i debian-installer/country string TW
d-i debian-installer/locale string en_US.UTF-8

### --- 鍵盤配置 ---
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/modelcode string pc105
d-i keyboard-configuration/layout string us
d-i keyboard-configuration/xkb-keymap string us

### --- 網路 ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-auto
d-i netcfg/get_domain string unassigned-domain

### --- 時區 ---
d-i time/zone string Asia/Taipei
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### --- 分割磁碟（全自動、/home 獨立、非LVM） ---
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select home
# home 方案會自動建立 /、/home、swap
d-i partman-auto/init_automatically_partition select biggest_free

d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### --- 軟體套件 ---
tasksel tasksel/first multiselect standard
d-i pkgsel/include string sudo vim git

### --- 套件來源與鏡像 ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### --- 其他自動化參數 ---
d-i preseed/early_command string true
d-i preseed/late_command string true

### --- 安裝結束 ---
d-i grub-installer/only_debian boolean true
d-i finish-install/reboot_in_progress note
