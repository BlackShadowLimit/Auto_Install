## Language and region settings
d-i debian-installer/language string en
d-i debian-installer/country string TW
d-i debian-installer/locale string en_US.UTF-8

## Keyboard layout (American US)
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/modelcode string pc105
d-i keyboard-configuration/layout string us
d-i keyboard-configuration/xkb-keymap string us

## Network settings
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-auto
d-i netcfg/get_domain string unassigned-domain

## Timezone
d-i time/zone string Asia/Taipei
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

## Full disk auto partition (/home separate, no LVM)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select home
d-i partman-auto/init_automatically_partition select biggest_free

d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

## Task selection and extra packages
tasksel tasksel/first multiselect standard
d-i pkgsel/include string sudo vim git

## Mirror settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

## Install GRUB to the default boot disk (auto-detect)
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

## Early command stub (placeholder for custom hooks)
d-i preseed/early_command string true

## Post-install: add the first regular user to the sudo group
# This block finds the first user with UID >=1000 (i.e., the first human user)
# and adds them to the sudo group so you get sudo privileges right out of the box.
d-i preseed/late_command string \
  FIRSTUSER=$(awk -F: '$3>=1000&&$3<65534{print $1;exit}' /target/etc/passwd); \
  in-target usermod -aG sudo $FIRSTUSER

## Finish up and auto-reboot
d-i finish-install/reboot_in_progress note
